<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>LONG PIG shutters audio</title>
<style>html, body { margin: 0; background: transparent; overflow: hidden; }</style>
</head>
<body>
<script>
// LONG PIG sounds: shutter motor / stop (client/shutters.lua) and the restaurant sounds (client/restaurant.lua, 0.2.9),
// volume already distance-scaled by the client; loop = true for the hood fan.
const voices = {};
function clamp(v) { return Math.max(0, Math.min(1, v || 0)); }
function fadeOut(a, ms) {
  const steps = 10, start = a.volume;
  let i = 0;
  const h = setInterval(() => {
    i++;
    a.volume = clamp(start * (1 - i / steps));
    if (i >= steps) { clearInterval(h); a.pause(); a.currentTime = 0; }
  }, Math.max(10, ms / steps));
}
window.addEventListener('message', (ev) => {
  const m = ev.data || {};
  if (m.type === 'play') {
    if (voices[m.id]) { voices[m.id].pause(); }
    const a = new Audio(m.src);
    a.volume = clamp(m.volume);
    a.loop = !!m.loop;
    if (!a.loop) a.onended = () => { if (voices[m.id] === a) delete voices[m.id]; };   // one-shot sounds free themselves
    voices[m.id] = a;
    a.play().catch(() => {});
  } else if (m.type === 'vol' && voices[m.id]) {
    voices[m.id].volume = clamp(m.volume);
  } else if (m.type === 'stop' && voices[m.id]) {
    fadeOut(voices[m.id], 250);
    delete voices[m.id];
  }
});
</script>
</body>
</html>
